# Publishes the lp/ directory as the GitHub Pages site root.
# The repository owner must set Settings → Pages → Build and deployment
# → Source to "GitHub Actions" (after this file is on the default branch).

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload lp directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: lp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
